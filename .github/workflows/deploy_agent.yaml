# This workflow deploys Microsoft Foundry Agents
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Deploy Agents

on:
  workflow_dispatch:

env:
  PROJECT_ENDPOINT: https://nampacx-fndry-2.services.ai.azure.com/api/projects/nampacx-fndry-prjct

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    
    - name: Restore dependencies
      run: dotnet restore src/DeployAgent/DeployAgent.csproj
    
    - name: Build
      run: dotnet build src/DeployAgent/DeployAgent.csproj --no-restore
    
    - name: Deploy Agents
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      run: dotnet run --project src/DeployAgent.CLI/DeployAgent.CLI.csproj -- sample/weather-agent.yaml --project-endpoint ${{ env.PROJECT_ENDPOINT }}
